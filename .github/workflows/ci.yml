on: [push, pull_request]

jobs:
  java-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Build with Maven
        working-directory: ./JUnit/demo
        run: mvn -B test

  ecommerce-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Projects/ecommerce-tests/requirements.txt

      - name: Install dependencies
        working-directory: ./Projects/ecommerce-tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run e-commerce browser tests
        working-directory: ./Projects/ecommerce-tests
        env:
          HEADLESS: 'true'
        run: python -m pytest