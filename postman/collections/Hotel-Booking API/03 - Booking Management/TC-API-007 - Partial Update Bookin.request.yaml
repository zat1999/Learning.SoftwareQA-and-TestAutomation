$kind: http-request
url: "{{baseUrl}}/booking/{{bookingId}}"
method: PATCH
headers:
  Accept: application/json
  Cookie: token={{token}}
body:
  type: json
  content: "{\r

    \    \"firstname\" : \"Timmy\",\r

    \    \"totalprice\": 6767\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"First name should be updated\", function () {\r

      \    pm.expect(response.firstname).to.eql(\"Michael\");\r

      });\r

      \r

      pm.test(\"Total price should be updated\", function () {\r

      \    pm.expect(response.totalprice).to.eql(750);\r

      });\r

      \r

      pm.test(\"Last name should remain unchanged\", function () {\r

      \    pm.expect(response.lastname).to.eql(\"Smith\");\r

      });\r

      \r

      pm.test(\"Deposit status should remain unchanged\", function () {\r

      \    pm.expect(response.depositpaid).to.eql(false);\r

      });\r

      \r

      pm.test(\"Additional needs should remain unchanged\", function () {\r

      \    pm.expect(response.additionalneeds).to.eql(\"Lunch\");\r

      });"
    language: text/javascript
settings:
  disabledSystemHeaders:
    - accept
order: 4000
